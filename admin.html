<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Costella · Configuración</title><style>body{margin:0;background:#0f171c;color:#f1eed6;font-family:Arial,sans-serif}.wrap{max-width:820px;margin:60px auto;padding:0 24px}.card{background:#16242e;padding:34px;margin-top:20px;border:1px solid rgba(241,238,214,.12)}h1{font:400 54px Georgia,serif;margin:0 0 10px}p{color:#aeb7b7}label{display:block;margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.1em}input{width:100%;padding:14px;box-sizing:border-box;background:#0f171c;border:1px solid rgba(241,238,214,.18);color:#fff}button{margin-top:22px;border:0;padding:14px 18px;background:#c8a35a;color:#111;font-weight:700;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}.muted{font-size:12px}.status{margin-top:16px;color:#d9bd72}</style></head><body><div class="wrap"><div class="muted">COSTELLA · CONFIGURACIÓN LOCAL</div><h1>Administra los enlaces</h1><p>Este panel genera una nueva versión de <code>js/config.js</code>. En un sitio estático debes reemplazar ese archivo en GitHub para publicar los cambios.</p><div class="card"><label>Booking / calendario del asesor</label><input id="booking"><label>Webinar</label><input id="webinar"><label>Lead endpoint</label><input id="lead"><label>Meta Pixel ID</label><input id="pixel"><label>Mostrar escasez del webinar (true/false)</label><input id="scarcity" value="false"><label>Lugares del webinar</label><input id="slots" type="number" value="10"><button id="save">Descargar config.js</button><div class="status" id="status"></div></div></div><script>const ids=['booking','webinar','lead','pixel','scarcity','slots'];const old=JSON.parse(localStorage.getItem('costella_admin_v13')||'{}');ids.forEach(id=>document.getElementById(id).value=old[id]??document.getElementById(id).value);document.getElementById('save').onclick=()=>{const data=Object.fromEntries(ids.map(id=>[id,document.getElementById(id).value]));localStorage.setItem('costella_admin_v13',JSON.stringify(data));const text=`const COSTELLA_CONFIG = {\n  bookingUrl: ${JSON.stringify(data.booking)},\n  webinarUrl: ${JSON.stringify(data.webinar)},\n  leadEndpoint: ${JSON.stringify(data.lead)},\n  webinarSlots: ${Number(data.slots)||10},\n  showWebinarScarcity: ${String(data.scarcity).toLowerCase()==='true'},\n  metaPixelId: ${JSON.stringify(data.pixel)}\n};\n`;const blob=new Blob([text],{type:'text/javascript'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='config.js';a.click();URL.revokeObjectURL(a.href);document.getElementById('status').textContent='config.js generado.'};</script></body></html>
